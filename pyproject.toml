[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skypulse-streaming-lakehouse"
version = "0.1.0"
description = "Live aircraft telemetry streaming pipeline, Lakehouse storage on MinIO, windowed aggregations and live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Youssef Ech-Chahlaoui", email = "youssef.10.chahlaoui@gmail.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "kafka-python-ng>=2.2.2",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.0.0",
    "minio>=7.2.0",
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "pydeck>=0.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
